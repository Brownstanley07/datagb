name: hyiprio
description: "DataGo's premium investment experience for Android and iOS."
publish_to: "none"
version: 1.3.0+3

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  dio: ^5.9.0
  smooth_page_indicator: ^1.2.1
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  fluttertoast: ^9.0.0
  pin_code_fields: ^8.0.1
  image_picker: ^1.1.2
  file_picker: ^8.0.6
  path: ^1.9.1
  dotted_border: ^3.1.0
  flutter_svg: ^2.2.2
  flutter_spinkit: ^5.2.2
  webview_flutter: ^4.13.0
  intl: ^0.20.2
  share_plus: ^12.0.1
  flutter_widget_from_html: ^0.17.1
  change_app_package_name: ^1.5.0
  local_auth: ^3.0.0
  flutter_secure_storage: ^10.3.1

  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^19.5.0
  firebase_core: ^4.3.0
  device_info_plus: ^12.3.0
  connectivity_plus: ^7.0.0
  shimmer: ^3.0.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^6.1.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/images/logo/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - lib/src/utils/helper/app_translation.json
    - assets/images/logo/
    - assets/images/home/
    - assets/images/home/quicksvg/
    - assets/icons/
    - assets/icons/svg/
    - assets/icons/png/
    - assets/icons/profileSvg/
    - assets/icons/transactionType/
    - assets/others/

  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
